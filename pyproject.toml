[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-core>=3.2", "flit-scm", "wheel" ]

[project]
name = "threadmill"
readme = "README.md"
keywords = [ "Django", "tasks", "worker" ]
license = { file = "LICENSE" }
authors = [
  { name = "Johannes Maron", email = "johannes@maron.family" },
]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading",
  "Programming Language :: Python :: Free Threading :: 3 - Stable",
  "Topic :: Communications :: Email",
  "Topic :: Software Development",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dynamic = [ "description", "version" ]
dependencies = [ "django>=6.1" ]
optional-dependencies.inspector = [
  "textual>=8.2.7",
]
optional-dependencies.opentelemetry = [
  "opentelemetry-exporter-otlp-proto-http>=1.45",
  "opentelemetry-sdk>=1.45",
]
optional-dependencies.redis = [ "redis>=5" ]
urls.Changelog = "https://github.com/codingjoe/threadmill/releases"
urls.Documentation = "https://github.com/codingjoe/threadmill/"
urls.Funding = "https://github.com/sponsors/codingjoe"
# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
urls.Homepage = "https://github.com/codingjoe/threadmill"
urls.Issues = "https://github.com/codingjoe/threadmill/issues"
urls.Releasenotes = "https://github.com/codingjoe/threadmill/releases/latest"
urls.Source = "https://github.com/codingjoe/threadmill"

[dependency-groups]
dev = [
  { include-group = "test" },
]
test = [
  "celery",
  "django-tasks-db",
  "django-tasks-rq",
  "dramatiq[redis]>=2.2.1",
  "huey",
  "pytest",
  "pytest-asyncio",
  "pytest-benchmark",
  "pytest-cov",
  "pytest-django",
  "redis>=5",
]

[tool.setuptools_scm]
write_to = "threadmill/_version.py"

[tool.flit]
module.name = "threadmill"

[tool.ruff]
src = [ "benchmarks", "tests", "threadmill" ]
lint.extend-select = [
  "C90",
  "D",
  "D213",
  "DJ",
  "E",
  "G",
  "N",
  "PERF",
  "PT",
  "PTH",
  "RET",
  "S",
  "SIM",
  "SLOT",
  "T20",
  "TRY",
  "UP",
  "W",
]
lint.ignore = [ "D1", "D203", "D212", "E501", "RUF01" ]
lint.per-file-ignores."benchmarks/**" = [
  "DJ006",
  "DJ007",
  "DJ008",
  "PLR2004",
  "S101",
  "S105",
  "S106",
  "S311",
  "S603",
  "S607"
]
lint.per-file-ignores."tests/**" = [
  "DJ006",
  "DJ007",
  "DJ008",
  "PLR2004",
  "S101",
  "S105",
  "S106",
  "S311",
  "S603",
  "S607"
]
lint.isort.combine-as-imports = true
lint.isort.force-wrap-aliases = true
lint.isort.known-first-party = [ "threadmill", "tests" ]
lint.isort.section-order = [ "future", "standard-library", "third-party", "first-party", "local-folder" ]
lint.isort.split-on-trailing-comma = true
lint.pydocstyle.convention = "pep257"

[tool.pytest]
ini_options.minversion = "6.1"
ini_options.testpaths = [ "benchmarks", "tests" ]
ini_options.addopts = """\
  --cov --cov-report=xml --cov-report=term --tb=short -rxs --benchmark-autosave --benchmark-group-by=fullname \
  --benchmark-min-rounds=10\
  """
ini_options.markers = [
  "benchmark: mark benchmark tests.",
]
ini_options.asyncio_mode = "auto"
ini_options.DJANGO_SETTINGS_MODULE = "tests.testapp.settings"

[tool.coverage]
run.source = [ "threadmill" ]
report.skip_covered = true
report.show_missing = true
